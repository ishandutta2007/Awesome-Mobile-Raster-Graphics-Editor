<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>

    <linearGradient id="accent-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="brush-stroke-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glow-cyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-purple" cx="80%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-pink" cx="50%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="shadow-main" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Animations -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1.5deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-1.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(1.08); }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -120; }
      }
      @keyframes waveFloat {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(25px); }
      }

      .floating-1 { animation: floatSlow 7s ease-in-out infinite; }
      .floating-2 { animation: floatReverse 8.5s ease-in-out infinite; }
      .pulse-orb { transform-origin: center; animation: pulseGlow 6s ease-in-out infinite; }
      .dashed-path { stroke-dasharray: 8 12; animation: dashAnim 15s linear infinite; }
      .wave-flow { animation: waveFloat 9s ease-in-out infinite alternate; }

      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 500;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)"/>

  <!-- Subtle Pixel/Raster Grid Pattern in Background -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <pattern id="pixel-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none"/>
      <circle cx="15" cy="15" r="1" fill="#38bdf8"/>
    </pattern>
    <rect width="1200" height="420" fill="url(#pixel-grid)"/>
  </g>

  <!-- Ambient Dynamic Glowing Orbs (Strictly in Background) -->
  <circle cx="200" cy="140" r="260" fill="url(#glow-cyan)" class="pulse-orb"/>
  <circle cx="1020" cy="180" r="280" fill="url(#glow-purple)" class="pulse-orb" style="animation-delay: -3s;"/>
  <circle cx="600" cy="360" r="240" fill="url(#glow-pink)" class="pulse-orb" style="animation-delay: -1.5s;"/>

  <!-- Fluid Artistic Brush Stroke & Paths (Background Accent) -->
  <g opacity="0.45" class="wave-flow">
    <path d="M -50,300 C 250,180 400,380 700,240 C 950,120 1050,280 1250,200"
          fill="none" stroke="url(#brush-stroke-grad)" stroke-width="8" stroke-linecap="round"/>
    <path d="M -20,270 C 280,360 520,180 820,290 C 1020,360 1120,230 1240,260"
          fill="none" stroke="url(#accent-text)" stroke-width="2.5" class="dashed-path" opacity="0.6"/>
  </g>

  <!-- Stylized Decorative Floating Background Badges (Pills) -->
  <g class="floating-1" opacity="0.85">
    <!-- Left Pill: Touch & Apple Pencil -->
    <g transform="translate(60, 65)">
      <rect width="165" height="36" rx="18" fill="url(#pill-grad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2"/>
      <circle cx="20" cy="18" r="6" fill="#38bdf8" filter="url(#glow-filter)"/>
      <text x="36" y="23" class="badge-text">✏️ Stylus Pressure</text>
    </g>
    <!-- Left Lower Pill: GPU Brushes -->
    <g transform="translate(80, 325)">
      <rect width="170" height="36" rx="18" fill="url(#pill-grad)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.2"/>
      <circle cx="20" cy="18" r="6" fill="#818cf8" filter="url(#glow-filter)"/>
      <text x="36" y="23" class="badge-text">⚡ 120 FPS Brushes</text>
    </g>
  </g>

  <g class="floating-2" opacity="0.85">
    <!-- Right Pill: Cross Platform -->
    <g transform="translate(975, 75)">
      <rect width="165" height="36" rx="18" fill="url(#pill-grad)" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.2"/>
      <circle cx="20" cy="18" r="6" fill="#c084fc" filter="url(#glow-filter)"/>
      <text x="36" y="23" class="badge-text">📱 iPad &amp; Android</text>
    </g>
    <!-- Right Lower Pill: Layers & Masks -->
    <g transform="translate(955, 315)">
      <rect width="180" height="36" rx="18" fill="url(#pill-grad)" stroke="#f472b6" stroke-opacity="0.4" stroke-width="1.2"/>
      <circle cx="20" cy="18" r="6" fill="#f472b6" filter="url(#glow-filter)"/>
      <text x="36" y="23" class="badge-text">🎨 Multi-Layer Engine</text>
    </g>
  </g>

  <!-- FOREGROUND CONTENT LAYER (Guaranteed on Top, High Contrast, Drop Shadows) -->
  <g id="foreground" filter="url(#shadow-main)">
    <!-- Category Mini-Header Badge -->
    <g transform="translate(450, 68)">
      <rect width="300" height="32" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="url(#accent-text)" stroke-width="1.2"/>
      <text x="150" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">
        ✦ CURATED AWESOME ECOSYSTEM ✦
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="165" text-anchor="middle" class="title-text" font-size="44" fill="#ffffff">
      Awesome Mobile Raster
    </text>
    <text x="600" y="218" text-anchor="middle" class="title-text" font-size="44" fill="url(#accent-text)">
      Graphics Editor
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="600" y="265" text-anchor="middle" class="sub-text" font-size="17" fill="#cbd5e1">
      Curated Directory of GPU-Accelerated Painting, Touch Illustration &amp; Mobile Photo Editing
    </text>

    <!-- Feature Quick Highlights Pill Bar -->
    <g transform="translate(325, 298)">
      <rect width="550" height="34" rx="17" fill="#030712" fill-opacity="0.65" stroke="#334155" stroke-width="1"/>
      <text x="275" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
        <tspan fill="#38bdf8">🎨 Procreate &amp; Krita</tspan>
        <tspan fill="#64748b"> • </tspan>
        <tspan fill="#a855f7">🚀 Open-Source Tablets</tspan>
        <tspan fill="#64748b"> • </tspan>
        <tspan fill="#ec4899">🖌️ Touch &amp; Stylus Art</tspan>
      </text>
    </g>
  </g>

  <!-- Sleek Outer Border Highlight -->
  <rect width="1198" height="418" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.5"/>
</svg>
